# ============================================================
# 苗绣·识裳 — 纯本地容器编排（K1 / x86_64 双平台）
# ============================================================
# 所有服务在单机本地运行，host 网络模式，通过 localhost 互访。
#
# K1 (riscv64):
#   docker compose up -d --build
#
# x86_64:
#   docker compose -f docker-compose.x86.yml up -d --build
#
# 端口：
#   443  → 网关（前端 SPA + API 路由）
#   8000 → YOLO 检测
#   8001 → ASR 语音识别
#   8002 → TTS 语音合成
# ============================================================

services:
  # ========================
  # 👁️ YOLO 双模型检测
  # ========================
  yolo:
    build:
      context: .
      dockerfile: Dockerfile.yolo
    image: miao-sage:yolo
    container_name: miao-yolo
    restart: unless-stopped
    network_mode: host
    environment:
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-4}
      - OPENBLAS_NUM_THREADS=${OPENBLAS_NUM_THREADS:-4}
    volumes:
      - miao-cache:/root/.cache
    deploy:
      resources:
        limits: { cpus: '4.0', memory: 2048M }
        reservations: { cpus: '0.5', memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # ========================
  # 👂 ASR 语音识别
  # ========================
  asr:
    build:
      context: .
      dockerfile: Dockerfile.asr
    image: miao-sage:asr
    container_name: miao-asr
    restart: unless-stopped
    network_mode: host
    volumes:
      - miao-cache:/root/.cache
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 1024M }
        reservations: { cpus: '0.5', memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # ========================
  # 🔊 TTS 语音合成
  # ========================
  tts:
    build:
      context: .
      dockerfile: Dockerfile.tts
    image: miao-sage:tts
    container_name: miao-tts
    restart: unless-stopped
    network_mode: host
    environment:
      - OMP_NUM_THREADS=${OMP_NUM_THREADS:-2}
    volumes:
      - miao-cache:/root/.cache
    deploy:
      resources:
        limits: { cpus: '3.0', memory: 2048M }
        reservations: { cpus: '1.0', memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

  # ========================
  # 🚪 API 网关
  # ========================
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.k1
    image: miao-sage:gateway
    container_name: miao-gateway
    restart: unless-stopped
    network_mode: host
    pid: host
    depends_on:
      - yolo
      - asr
      - tts
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-http://127.0.0.1:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-}
      - OLLAMA_MODEL_KEYWORDS=${OLLAMA_MODEL_KEYWORDS:-miao,qwen}
      - YOLO_URL=http://127.0.0.1:8000
      - ASR_URL=http://127.0.0.1:8001
      - TTS_URL=http://127.0.0.1:8002
    volumes:
      - miao-cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://127.0.0.1:443/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: '2.0', memory: 512M }
        reservations: { cpus: '0.3', memory: 128M }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "3" }

volumes:
  miao-cache:
    name: miao-cache
